name: PR Guardrails

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-guardrails-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks (Working Tree)
        run: gitleaks detect --source . --no-git -v --redact

  hygiene:
    name: Governance & Hygiene Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Zero Microsoft Office Sprawl & Manifest Integrity
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" --depth=1 || true
            CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" --diff-filter=ACMR || true)
            if [ -n "$CHANGED" ]; then
              BAD_OFFICE=$(echo "$CHANGED" | grep -iE '\.(docx|pptx|xlsx)$' | grep -viE '(^|/)(__tests__|tests?|fixtures?)(/|$)' || true)
              if [ -n "$BAD_OFFICE" ]; then
                echo "ERROR: Microsoft Office sprawl blocked by governance:"
                echo "$BAD_OFFICE"
                exit 1
              fi
            fi
          fi

          if [ -f package.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json valid');"
          fi

          if [ -n "${CHANGED:-}" ]; then
            PY_FILES=$(echo "$CHANGED" | grep -E '\.py$' || true)
            if [ -n "$PY_FILES" ]; then
              python3 -m py_compile $PY_FILES
              echo "Python syntax valid"
            fi
          fi